<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Listado de Estudiantes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi"
        crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-secondary text-uppercase">
  <div class="container">
    <a class="navbar-brand" th:href="@{/escuela}">Escuela Deportiva</a>
  </div>
</nav>

<div class="container mt-5">
  <h2 class="text-center mb-4">Listado de Estudiantes</h2>
  <table class="table table-hover table-striped">
    <thead>
    <tr>
      <th scope="col">ID</th>
      <th scope="col">Nombre</th>
      <th scope="col">Apellido</th>
      <th scope="col">Correo</th>
      <th scope="col">Edad</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="estudiante : ${estudiantes}">
      <td th:text="${estudiante.id}">ID</td>
      <td th:text="${estudiante.nombre}">Nombre</td>
      <td th:text="${estudiante.apellido}">Apellido</td>
      <td th:text="${estudiante.correo}">Correo</td>
      <td th:text="${estudiante.edad}">Edad</td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
