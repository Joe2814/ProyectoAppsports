<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Organizar Horarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h2 class="mb-4">Tus Horarios</h2>
    <table class="table">
        <thead><tr><th>Día</th><th>Actividad</th><th>Inicio</th><th>Fin</th></tr></thead>
        <tbody>
        <tr th:each="h : ${horarios}">
            <td th:text="${h.dia}"></td>
            <td th:text="${h.actividad}"></td>
            <td th:text="${h.inicio}"></td>
            <td th:text="${h.fin}"></td>
        </tr>
        </tbody>
    </table>

    <h3 class="mt-5">Agregar / Actualizar Horario</h3>
    <form th:action="@{/escuela/profesor/organizar-horarios}" th:object="${nuevoHorario}" method="post">
        <div class="row g-3 align-items-end">
            <div class="col-md-2"><input type="text" class="form-control" placeholder="Día" th:field="*{dia}" required></div>
            <div class="col-md-4"><input type="text" class="form-control" placeholder="Actividad" th:field="*{actividad}" required></div>
            <div class="col-md-2"><input type="time" class="form-control" th:field="*{inicio}" required></div>
            <div class="col-md-2"><input type="time" class="form-control" th:field="*{fin}" required></div>
            <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Guardar</button></div>
        </div>
    </form>

    <a th:href="@{/escuela/profesor}" class="btn btn-secondary mt-4">Volver</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
