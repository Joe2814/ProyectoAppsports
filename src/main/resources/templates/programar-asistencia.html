<!-- src/main/resources/templates/programar-asistencia.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Programar Asistencia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<div class="container py-5">

    <h2 class="mb-4 text-center">Horario Completo</h2>
    <table class="table">
        <thead>
        <tr><th>Día</th><th>Actividad</th><th>Inicio</th><th>Fin</th></tr>
        </thead>
        <tbody>
        <tr th:each="h : ${horarios}">
            <td th:text="${h.dia}"></td>
            <td th:text="${h.actividad}"></td>
            <td th:text="${h.inicio}"></td>
            <td th:text="${h.fin}"></td>
        </tr>
        </tbody>
    </table>

    <h3 class="mt-5 text-center">Selecciona tus días de asistencia</h3>
    <form th:action="@{/escuela/estudiante/programar}" method="post">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="dias" value="Lunes" id="diaLunes">
            <label class="form-check-label" for="diaLunes">Lunes</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="dias" value="Martes" id="diaMartes">
            <label class="form-check-label" for="diaMartes">Martes</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="dias" value="Miércoles" id="diaMiercoles">
            <label class="form-check-label" for="diaMiercoles">Miércoles</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="dias" value="Jueves" id="diaJueves">
            <label class="form-check-label" for="diaJueves">Jueves</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="dias" value="Viernes" id="diaViernes">
            <label class="form-check-label" for="diaViernes">Viernes</label>
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary">Ver mi Horario</button>
        </div>
    </form>

    <div th:if="${filtrados != null}">
        <h3 class="mt-5 mb-3 text-center">Tu Horario Filtrado</h3>
        <table class="table table-bordered">
            <thead>
            <tr><th>Día</th><th>Actividad</th><th>Inicio</th><th>Fin</th></tr>
            </thead>
            <tbody>
            <tr th:each="h : ${filtrados}">
                <td th:text="${h.dia}"></td>
                <td th:text="${h.actividad}"></td>
                <td th:text="${h.inicio}"></td>
                <td th:text="${h.fin}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/escuela}" class="btn btn-secondary">Volver al Inicio</a>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
