<!-- src/main/resources/templates/horarios-estudiante.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Programar Asistencia</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body class="py-5 bg-light">

<div class="container">
    <h2 class="mb-4 text-center">Horario Completo</h2>

    <!-- Tabla con TODO el horario -->
    <table class="table table-striped mb-5">
        <thead>
        <tr>
            <th>Día</th><th>Actividad</th><th>Inicio</th><th>Fin</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="h : ${horarios}">
            <td th:text="${h.dia}"></td>
            <td th:text="${h.actividad}"></td>
            <td th:text="${h.inicio}"></td>
            <td th:text="${h.fin}"></td>
        </tr>
        </tbody>
    </table>

    <h3 class="mb-3 text-center">Selecciona tus días de asistencia</h3>
    <form th:action="@{/escuela/estudiante/asistencia}" method="get" class="text-center">
        <div class="form-check form-check-inline"
             th:each="d : ${{'Lunes','Martes','Miércoles','Jueves','Viernes'}}">
            <input class="form-check-input"
                   type="checkbox"
                   name="dias"
                   th:id="${'dia'+d}"
                   th:value="${d}">
            <label class="form-check-label"
                   th:for="${'dia'+d}"
                   th:text="${d}"></label>
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary btn-lg">Guardar Selección</button>
        </div>
    </form>
</div>

</body>
</html>
